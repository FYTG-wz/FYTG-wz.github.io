<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方言发音挑战 - 温州话 & 海南话</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style type="text/tailwindcss">
        @layer utilities {
            .recording {
                @apply animate-pulse bg-red-500 text-white;
            }
            .swipe-area {
                @apply cursor-grab active:cursor-grabbing;
            }
            .progress-bar {
                @apply h-2 bg-gray-200 rounded-full overflow-hidden;
            }
            .progress-fill {
                @apply h-full bg-blue-500 transition-all duration-100;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-start p-4 md:p-8">
    <!-- 关闭按钮 -->
    <div class="w-full max-w-md md:max-w-lg flex justify-end mb-4">
        <button id="closeBtn" class="text-gray-600 hover:text-red-500 text-2xl transition-colors">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- 标题区域 -->
    <div class="w-full max-w-md md:max-w-lg text-center mb-6">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800">方言发音挑战</h1>
        <p class="text-gray-600 mt-2">温州话 & 海南话 | 共5题</p>
    </div>

    <!-- 兼容性提示 -->
    <div id="compatibilityAlert" class="hidden w-full max-w-md md:max-w-lg bg-yellow-50 border border-yellow-200 rounded-lg p-3 mb-4 text-yellow-800 text-sm">
        <i class="fas fa-exclamation-triangle mr-2"></i>
        <span>你的浏览器可能不支持部分功能，请使用Chrome、Edge或Firefox浏览器</span>
    </div>

    <!-- 题目容器 -->
    <div id="questionContainer" class="w-full max-w-md md:max-w-lg bg-white rounded-xl shadow-md p-6 md:p-8 swipe-area" 
         style="touch-action: pan-y; user-select: none;">
        <!-- 题目序号 -->
        <div id="questionNumber" class="text-lg font-semibold text-gray-700 mb-4">第1题</div>
        
        <!-- 音频播放区域 -->
        <div class="mb-6">
            <button id="playAudioBtn" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-lg flex items-center justify-center gap-2 transition-colors mb-3">
                <i class="fas fa-volume-up"></i>
                <span>播放参考发音</span>
            </button>
            <!-- 示例音频（可直接播放） -->
            <audio id="audioPlayer" controls class="w-full mt-2 hidden">
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                你的浏览器不支持音频播放
            </audio>
            <!-- 显示音频控件 -->
            <div id="audioFallback" class="w-full mt-2">
                <audio controls class="w-full">
                    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                    你的浏览器不支持音频播放
                </audio>
            </div>
        </div>

        <!-- 录音区域 -->
        <div class="mb-8">
            <div class="flex flex-col items-center">
                <!-- 录音按钮 -->
                <button id="recordBtn" class="w-16 h-16 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-3xl mb-4 transition-all">
                    <i class="fas fa-microphone text-gray-700"></i>
                </button>
                
                <!-- 倒计时区域 -->
                <div id="timerContainer" class="hidden w-full mb-3">
                    <p class="text-center text-gray-600 mb-1">录音倒计时: <span id="timerText" class="font-bold">15</span> 秒</p>
                    <div class="progress-bar">
                        <div id="progressBar" class="progress-fill w-full"></div>
                    </div>
                </div>
                
                <!-- 录音状态提示 -->
                <p id="recordStatus" class="text-gray-500 text-sm hidden">正在录音，请说出你听到的方言...</p>
                
                <!-- 录音权限提示 -->
                <p id="permissionTip" class="text-blue-500 text-sm mt-2 hidden">
                    <i class="fas fa-info-circle mr-1"></i> 点击录音按钮后请允许麦克风权限
                </p>
            </div>
        </div>

        <!-- 检测结果区域 -->
        <div id="resultContainer" class="hidden p-4 rounded-lg bg-gray-50 border border-gray-200 mt-4">
            <h3 class="font-semibold text-gray-800 mb-2">发音检测结果</h3>
            <p class="mb-2">
                <span class="text-gray-600">标准度评分：</span>
                <span id="scoreText" class="font-bold text-green-600">0</span> 分
            </p>
            <p class="mb-2">
                <span class="text-gray-600">你的发音识别：</span>
                <span id="userSpeechText" class="font-medium">-</span>
            </p>
            <p class="mb-1">
                <span class="text-gray-600">正确释义：</span>
                <span id="correctMeaningText" class="font-medium">-</span>
            </p>
            <p class="text-gray-500 text-sm mt-1">
                <span class="text-gray-600">方言说明：</span>
                <span id="dialectExplanationText">-</span>
            </p>
        </div>

        <!-- 滑动提示 -->
        <div class="text-center text-gray-400 text-sm mt-6">
            <i class="fas fa-arrow-left"></i> 向左滑动进入下一题
            <p class="mt-1 text-xs">PC端可按住鼠标左键向左拖动</p>
        </div>
    </div>

    <!-- 完成提示 -->
    <div id="completionMessage" class="hidden w-full max-w-md md:max-w-lg bg-white rounded-xl shadow-md p-6 md:p-8 text-center mt-8">
        <h2 class="text-xl font-bold text-green-600 mb-4">挑战完成！</h2>
        <p class="text-gray-700 mb-4">你已完成所有5道方言发音挑战题</p>
        <p class="text-gray-600 mb-6">总平均分：<span id="totalScore" class="font-bold">0</span> 分</p>
        <button id="restartBtn" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-lg transition-colors">
            重新开始
        </button>
    </div>

    <script>
        // 题目数据
        const questions = [
            {
                id: 1,
                dialect: "温州话",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                dialectPhrase: "你到何宕去？",
                standardText: "你去哪里？",
                meaning: "你去哪里？",
                explanation: "温州话「你到何宕去？」(nì dào gā dāng kè?) 是日常询问去向的常用语，「何宕」表示「哪里」。"
            },
            {
                id: 2,
                dialect: "海南话",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                dialectPhrase: "早晨",
                standardText: "早上好",
                meaning: "早上好",
                explanation: "海南话「早晨」(zǎo sén) 是经典的日常问候语，发音与普通话有明显区别。"
            },
            {
                id: 3,
                dialect: "温州话",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                dialectPhrase: "几多钿？",
                standardText: "多少钱？",
                meaning: "多少钱？",
                explanation: "温州话「几多钿？」(gé duō di?) 是购物时询问价格的常用表达，「钿」指钱。"
            },
            {
                id: 4,
                dialect: "海南话",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                dialectPhrase: "食糜未？",
                standardText: "吃饭了吗？",
                meaning: "吃饭了吗？",
                explanation: "海南话「食糜未？」(jia bō bō?) 是海南最具代表性的日常问候语，「糜」指粥/饭。"
            },
            {
                id: 5,
                dialect: "温州话",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
                dialectPhrase: "慢慢趙",
                standardText: "慢慢来",
                meaning: "慢慢来",
                explanation: "温州话「慢慢趙」(mā mā jiào) 表示让对方不要着急，「趙」在这里作为语气助词。"
            }
        ];

        // 全局变量
        let currentQuestionIndex = 0;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let timerInterval = null;
        let remainingTime = 15;
        let scores = [];
        let startX = 0;
        
        // DOM元素
        const elements = {
            questionContainer: document.getElementById('questionContainer'),
            questionNumber: document.getElementById('questionNumber'),
            playAudioBtn: document.getElementById('playAudioBtn'),
            audioPlayer: document.getElementById('audioPlayer'),
            recordBtn: document.getElementById('recordBtn'),
            timerContainer: document.getElementById('timerContainer'),
            timerText: document.getElementById('timerText'),
            progressBar: document.getElementById('progressBar'),
            recordStatus: document.getElementById('recordStatus'),
            resultContainer: document.getElementById('resultContainer'),
            scoreText: document.getElementById('scoreText'),
            userSpeechText: document.getElementById('userSpeechText'),
            correctMeaningText: document.getElementById('correctMeaningText'),
            dialectExplanationText: document.getElementById('dialectExplanationText'),
            closeBtn: document.getElementById('closeBtn'),
            completionMessage: document.getElementById('completionMessage'),
            totalScore: document.getElementById('totalScore'),
            restartBtn: document.getElementById('restartBtn'),
            compatibilityAlert: document.getElementById('compatibilityAlert'),
            permissionTip: document.getElementById('permissionTip')
        };

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            // 检测浏览器兼容性
            checkBrowserCompatibility();
            
            // 初始化第一题
            initCurrentQuestion();
            
            // 绑定事件
            bindEvents();
            
            // 显示权限提示
            elements.permissionTip.classList.remove('hidden');
        });

        // 检查浏览器兼容性
        function checkBrowserCompatibility() {
            // 检查MediaRecorder支持
            if (!window.MediaRecorder) {
                elements.compatibilityAlert.classList.remove('hidden');
                elements.recordBtn.disabled = true;
                elements.recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
                alert('⚠️ 你的浏览器不支持录音功能，请使用Chrome、Microsoft Edge或Firefox浏览器');
            }
            
            // 检查语音识别支持
            if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
                elements.compatibilityAlert.classList.remove('hidden');
                alert('⚠️ 你的浏览器不支持语音识别功能，无法检测发音标准度');
            }
        }

        // 绑定所有事件
        function bindEvents() {
            // 播放音频
            elements.playAudioBtn.addEventListener('click', () => {
                elements.audioPlayer.play().catch(error => {
                    alert('音频播放失败，请检查网络或浏览器设置');
                    console.error('音频播放错误:', error);
                });
            });

            // 录音按钮
            elements.recordBtn.addEventListener('click', toggleRecording);

            // 关闭按钮
            elements.closeBtn.addEventListener('click', () => {
                if (confirm('确定要退出挑战吗？')) {
                    stopRecording();
                    window.location.reload();
                }
            });

            // 重新开始按钮
            elements.restartBtn.addEventListener('click', () => {
                currentQuestionIndex = 0;
                scores = [];
                initCurrentQuestion();
            });

            // 滑动事件 - 移动端触摸
            elements.questionContainer.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                e.preventDefault(); // 防止默认行为
            });

            elements.questionContainer.addEventListener('touchmove', (e) => {
                e.preventDefault(); // 防止页面滚动
            });

            elements.questionContainer.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                handleSwipe(startX, endX);
            });

            // 滑动事件 - PC端鼠标
            elements.questionContainer.addEventListener('mousedown', (e) => {
                startX = e.clientX;
                elements.questionContainer.style.cursor = 'grabbing';
            });

            elements.questionContainer.addEventListener('mouseup', (e) => {
                const endX = e.clientX;
                elements.questionContainer.style.cursor = 'grab';
                handleSwipe(startX, endX);
            });

            // 防止鼠标离开容器
            elements.questionContainer.addEventListener('mouseleave', () => {
                elements.questionContainer.style.cursor = 'grab';
            });
        }

        // 初始化当前题目
        function initCurrentQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            
            // 更新题目信息
            elements.questionNumber.textContent = `第${currentQuestion.id}题（${currentQuestion.dialect}）`;
            elements.audioPlayer.src = currentQuestion.audioUrl;
            
            // 重置录音状态
            resetRecordingState();
            
            // 隐藏结果区域
            elements.resultContainer.classList.add('hidden');
            
            // 显示题目，隐藏完成提示
            elements.questionContainer.classList.remove('hidden');
            elements.completionMessage.classList.add('hidden');
        }

        // 切换录音状态
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        // 开始录音
        async function startRecording() {
            try {
                // 请求麦克风权限
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                });
                
                // 创建MediaRecorder实例
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                // 收集录音数据
                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };
                
                // 录音结束处理
                mediaRecorder.onstop = () => {
                    // 停止所有音轨
                    stream.getTracks().forEach(track => track.stop());
                    
                    // 处理录音结果
                    setTimeout(() => {
                        processRecording();
                    }, 500);
                };
                
                // 开始录音
                mediaRecorder.start();
                isRecording = true;
                
                // 更新UI
                updateRecordingUI(true);
                
                // 启动倒计时
                startTimer();
                
                // 隐藏权限提示
                elements.permissionTip.classList.add('hidden');
                
            } catch (error) {
                console.error('录音错误:', error);
                
                if (error.name === 'NotAllowedError') {
                    alert('❌ 麦克风权限被拒绝！请在浏览器设置中允许麦克风权限后重试');
                } else if (error.name === 'NotFoundError') {
                    alert('❌ 未检测到麦克风设备！请连接麦克风后重试');
                } else {
                    alert(`❌ 录音启动失败：${error.message}`);
                }
                
                // 重置UI
                updateRecordingUI(false);
            }
        }

        // 停止录音
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                try {
                    mediaRecorder.stop();
                } catch (e) {
                    console.error('停止录音错误:', e);
                }
            }
            
            // 清除计时器
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // 重置状态
            isRecording = false;
            
            // 更新UI
            updateRecordingUI(false);
        }

        // 重置录音状态
        function resetRecordingState() {
            stopRecording();
            remainingTime = 15;
            elements.timerText.textContent = remainingTime;
            elements.progressBar.style.width = '100%';
        }

        // 更新录音UI状态
        function updateRecordingUI(isActive) {
            if (isActive) {
                // 录音中状态
                elements.recordBtn.classList.add('recording');
                elements.recordBtn.innerHTML = '<i class="fas fa-stop text-white"></i>';
                elements.timerContainer.classList.remove('hidden');
                elements.recordStatus.classList.remove('hidden');
                elements.recordStatus.textContent = '正在录音，请说出你听到的方言...';
            } else {
                // 停止录音状态
                elements.recordBtn.classList.remove('recording');
                elements.recordBtn.innerHTML = '<i class="fas fa-microphone text-gray-700"></i>';
                elements.timerContainer.classList.add('hidden');
                elements.recordStatus.classList.add('hidden');
            }
        }

        // 启动倒计时
        function startTimer() {
            remainingTime = 15;
            elements.timerText.textContent = remainingTime;
            elements.progressBar.style.width = '100%';
            
            // 清除现有计时器
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                remainingTime--;
                elements.timerText.textContent = remainingTime;
                
                // 更新进度条
                const progress = (remainingTime / 15) * 100;
                elements.progressBar.style.width = `${progress}%`;
                
                // 倒计时结束
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    stopRecording();
                    elements.recordStatus.textContent = '录音时间结束，正在识别...';
                }
            }, 1000);
        }

        // 处理录音结果
        function processRecording() {
            if (audioChunks.length === 0) {
                elements.userSpeechText.textContent = '未检测到声音，请重试';
                elements.scoreText.textContent = 0;
                showResult();
                return;
            }
            
            // 创建音频Blob
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            
            // 检查语音识别支持
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                // 不支持语音识别时的降级处理
                elements.userSpeechText.textContent = '浏览器不支持语音识别';
                elements.scoreText.textContent = 0;
                showResult();
                return;
            }
            
            // 创建识别实例
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            // 识别成功
            recognition.onresult = (event) => {
                const userSpeech = event.results[0][0].transcript;
                const currentQuestion = questions[currentQuestionIndex];
                
                // 计算相似度评分
                const score = calculateSimilarityScore(userSpeech, currentQuestion.standardText);
                scores[currentQuestionIndex] = score;
                
                // 更新结果
                elements.scoreText.textContent = score;
                elements.userSpeechText.textContent = userSpeech || '未识别';
                elements.correctMeaningText.textContent = currentQuestion.meaning;
                elements.dialectExplanationText.textContent = currentQuestion.explanation;
                
                // 显示结果
                showResult();
            };
            
            // 识别错误
            recognition.onerror = (error) => {
                console.error('语音识别错误:', error);
                elements.userSpeechText.textContent = '识别失败，请重试';
                elements.scoreText.textContent = 0;
                scores[currentQuestionIndex] = 0;
                
                // 显示基础结果
                const currentQuestion = questions[currentQuestionIndex];
                elements.correctMeaningText.textContent = currentQuestion.meaning;
                elements.dialectExplanationText.textContent = currentQuestion.explanation;
                
                showResult();
            };
            
            // 启动识别
            recognition.start();
        }

        // 显示结果
        function showResult() {
            elements.resultContainer.classList.remove('hidden');
        }

        // 计算文本相似度
        function calculateSimilarityScore(userText, standardText) {
            if (!userText || !standardText) return 0;
            
            // 清理文本
            const clean = (text) => text.toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]/g, '');
            const userClean = clean(userText);
            const standardClean = clean(standardText);
            
            // 完全匹配
            if (userClean === standardClean) return 100;
            
            // 计算字符匹配度
            let matchCount = 0;
            const standardChars = standardClean.split('');
            
            for (const char of userClean) {
                const idx = standardChars.indexOf(char);
                if (idx !== -1) {
                    matchCount++;
                    standardChars.splice(idx, 1);
                }
            }
            
            // 计算得分
            const maxLen = Math.max(standardClean.length, userClean.length);
            const score = maxLen > 0 ? Math.round((matchCount / maxLen) * 100) : 0;
            
            return score;
        }

        // 处理滑动
        function handleSwipe(startX, endX) {
            const swipeThreshold = 30; // 滑动阈值
            const swipeDistance = startX - endX;
            
            // 向左滑动
            if (swipeDistance > swipeThreshold) {
                if (currentQuestionIndex < questions.length - 1) {
                    // 下一题
                    currentQuestionIndex++;
                    initCurrentQuestion();
                    
                    // 滑动动画反馈
                    elements.questionContainer.style.opacity = '0.5';
                    setTimeout(() => {
                        elements.questionContainer.style.opacity = '1';
                    }, 300);
                } else {
                    // 完成所有题目
                    calculateTotalScore();
                    elements.questionContainer.classList.add('hidden');
                    elements.completionMessage.classList.remove('hidden');
                }
            }
        }

        // 计算总分
        function calculateTotalScore() {
            const validScores = scores.filter(score => !isNaN(score));
            const avg = validScores.length 
                ? Math.round(validScores.reduce((sum, s) => sum + s, 0) / validScores.length)
                : 0;
            elements.totalScore.textContent = avg;
        }
    </script>
</body>
</html>
